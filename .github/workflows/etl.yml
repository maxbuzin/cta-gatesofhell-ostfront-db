name: ETL

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Game version code"
        required: true
        type: string
      dry_run:
        description: "Dry-run only (recommended)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  etl:
    name: ETL notice (manual only)
    runs-on: ubuntu-latest
    environment: production-data
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Manual ETL reminder
        env:
          PATCH: ${{ inputs.patch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "ETL is not run automatically in CI."
          echo "On a trusted machine with DATABASE_URL_ETL (goh_etl):"
          echo "  pnpm etl --dry-run --patch ${PATCH:-current} --from data/raw/<dir>"
          echo "  pnpm etl --patch ${PATCH:-current} --from data/raw/<dir>"
          echo "dry_run=${DRY_RUN}"
          echo "Secrets live in GitHub Environment production-data only."
